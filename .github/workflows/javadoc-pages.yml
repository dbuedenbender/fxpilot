name: javadoc-pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Generate Javadoc
        # On a clean checkout the modular project needs compiled classes (module-info.class)
        # before javadoc:javadoc can build the report; otherwise the plugin sees mixed modules.
        run: |
          for attempt in 1 2 3; do
            mvn -B -DskipTests compile javadoc:javadoc && exit 0
            echo "Maven failed (attempt ${attempt}), retrying..."
            sleep 15
          done
          exit 1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Javadoc
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/reports/apidocs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

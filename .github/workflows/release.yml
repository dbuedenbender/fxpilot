name: release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Ref must be the release tag
        # A workflow_dispatch from a branch used to skip this check and deploy whatever main had; only the
        # tag that matches project.version may publish.
        run: |
          VERSION="$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version)"
          echo "ref=${GITHUB_REF_TYPE} '${GITHUB_REF_NAME}', project.version=${VERSION}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ] || [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::A release publishes only the tag v${VERSION}; this run is ${GITHUB_REF_TYPE} '${GITHUB_REF_NAME}'. Push the tag, or dispatch the workflow with --ref v${VERSION}."
            exit 1
          fi

      - name: Check Central credentials
        id: central
        env:
          CENTRAL_USER: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          GPG_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$CENTRAL_USER" ] && [ -n "$GPG_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Maven Central secrets are not configured; publishing is skipped."
          fi

      - name: Import GPG key
        if: steps.central.outputs.enabled == 'true'
        uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6
        with:
          gpg_private_key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Configure Central Portal credentials
        if: steps.central.outputs.enabled == 'true'
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>${MAVEN_CENTRAL_USERNAME}</username>
                <password>${MAVEN_CENTRAL_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Deploy to Central Portal
        if: steps.central.outputs.enabled == 'true'
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: ./mvnw -B -Prelease deploy

      - name: Central publishing skipped
        if: steps.central.outputs.enabled != 'true'
        run: echo "::notice::Maven Central publishing skipped because secrets are missing."

      - name: Remind to pin the launcher scripts
        if: steps.central.outputs.enabled == 'true'
        run: |
          VERSION="$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version)"
          PINNED="$(grep -m1 -oE '^DEFAULT_VERSION="[^"]+"' scripts/fxpilot-mcp.sh | cut -d'"' -f2)"
          if [ "$PINNED" != "$VERSION" ]; then
            echo "::warning::The launchers still pin $PINNED. After the deployment is published in the Central Portal, run scripts/pin-release.sh $VERSION and commit the change."
          fi

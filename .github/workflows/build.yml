name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '17', '21' ]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and test
        run: |
          for attempt in 1 2 3; do
            mvn -B clean verify && exit 0
            echo "Maven failed (attempt ${attempt}), retrying..."
            sleep 15
          done
          exit 1

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build demo app
        run: |
          for attempt in 1 2 3; do
            mvn -B -f examples/demo-app/pom.xml package && exit 0
            echo "Maven failed (attempt ${attempt}), retrying..."
            sleep 15
          done
          exit 1
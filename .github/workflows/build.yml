name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # The library targets JDK 11 and must still build on the oldest LTS we support.
          - java: '17'
            goal: '-DskipTests clean package'
          # The headless UI tests use JavaFX 21 and Monocle 21, which need JDK 21.
          - java: '21'
            goal: 'clean verify'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Maven ${{ matrix.goal }}
        run: |
          for attempt in 1 2 3; do
            mvn -B ${{ matrix.goal }} && exit 0
            echo "Maven failed (attempt ${attempt}), retrying..."
            sleep 15
          done
          exit 1

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build the example apps and replay their plans headless
        # installs the current fxpilot first, so the examples build against it before it is on Maven Central;
        # runs demo-app on the class path and modular-demo on the module path (Monocle, no display needed)
        run: |
          for attempt in 1 2 3; do
            mvn -B -DskipTests install && bash examples/replay-headless.sh && exit 0
            echo "Examples failed (attempt ${attempt}), retrying..."
            sleep 15
          done
          exit 1

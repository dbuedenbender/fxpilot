name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # The library targets JDK 11 and must still build on the oldest LTS we support.
          - java: '17'
            goal: '-DskipTests clean package'
          # The headless UI tests use JavaFX 21 and Monocle 21, which need JDK 21.
          - java: '21'
            goal: 'clean verify'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Maven ${{ matrix.goal }}
        # retries download failures only; a failing test fails the job at once
        run: bash .github/retry-downloads.sh ./mvnw -B ${{ matrix.goal }}

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build the example apps and replay their plans headless
        # installs the current fxpilot first, so the examples build against it before it is on Maven Central;
        # runs demo-app on the class path and modular-demo on the module path (Monocle, no display needed)
        run: bash .github/retry-downloads.sh bash -c "./mvnw -B -DskipTests install && bash examples/replay-headless.sh"

  jdk11:
    # The jar targets Java 11, but the tests need JDK 21 (Monocle 21); this runs the built MCP server on JDK 11.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build the jar
        run: bash .github/retry-downloads.sh ./mvnw -B -DskipTests package
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
      - name: Start the MCP server on JDK 11
        run: bash .github/mcp-smoke.sh -jar target/fxpilot.jar
